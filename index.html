<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070d" id="meta-theme">
<title>Trang cá nhân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08070d; --text:#f4f1fb; --muted:#a9a2bd;
  --surface:rgba(22,18,36,.75); --surface2:rgba(255,255,255,.07); --edge:rgba(255,255,255,.13);
  --scrim:rgba(8,7,13,.64); --shadow:0 16px 44px rgba(0,0,0,.42); --sheet:rgba(18,14,30,.96);
  --gl:rgba(255,255,255,.05); --gold:#fcd34d; --ok:#34d399;
  --pri:#c4b5fd; --pri-ink:var(--pri); --on-pri:#14102a;
  --blur:16px; --dock-w:420px; --dock-p:6px; --radius:24px;
  --font-family:'Lexend',system-ui,sans-serif; --text-g1:#ffffff; --text-g2:#ffffff;
  --r2:max(calc(var(--radius) - 8px),8px); --r3:max(calc(var(--radius) - 14px),6px);
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f3f0fa; --text:#1a1430; --muted:#5d5678;
  --surface:rgba(255,255,255,.85); --surface2:rgba(40,25,100,.06); --edge:rgba(40,25,100,.14);
  --scrim:rgba(243,240,250,.72); --shadow:0 14px 38px rgba(60,40,140,.16); --sheet:rgba(255,255,255,.97);
  --gl:rgba(40,25,100,.07); --pri-ink:color-mix(in srgb,var(--pri) 45%,#190c45);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--text);font:400 15px/1.55 var(--font-family);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
img,video{display:block}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1,h2,h3{font-family:var(--font-family);font-weight:700}

/* ===== NỀN ===== */
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;filter:blur(42px);opacity:.42}
.bgfx .b1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:var(--pri)}
.bgfx .b2{width:38vmax;height:38vmax;right:-10vmax;top:30%;background:#ff5d8f;opacity:.3}
.bgfx .b3{width:44vmax;height:44vmax;left:18%;bottom:-20vmax;background:#22d3c5;opacity:.25}
.bgfx .scrim{position:absolute;inset:0;background:var(--scrim)}
.bgfx .pix{position:absolute;inset:0;background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 78%);mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 78%)}
.prog{position:fixed;left:0;top:0;right:0;height:3px;z-index:90;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--pri),#ff5d8f,#22d3c5)}

/* ===== KÍNH ===== */
.glass{
  background:var(--surface);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  border:1px solid var(--edge);
  box-shadow:var(--shadow);
  border-radius:var(--radius);
}

/* ===== KHUNG ===== */
.shell{display:block}
.side{display:none}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 4px;max-width:760px;margin:0 auto}
.seg{position:sticky;z-index:40;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:2px;width:min(var(--dock-w),calc(100% - 24px));margin:8px auto 0;padding:var(--dock-p);border-radius:999px}
.seg a{position:relative;z-index:1;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 6px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .2s,transform .2s}
.seg a:active{transform:scale(.94)}
.seg a[aria-current=page]{color:var(--text)}
.glider{position:absolute;left:0;top:0;border-radius:999px;pointer-events:none;background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 55%,transparent),color-mix(in srgb,var(--pri) 18%,transparent));border:1px solid color-mix(in srgb,var(--pri) 55%,transparent);transition:transform .35s cubic-bezier(.3,1.2,.5,1),width .3s cubic-bezier(.3,1.2,.5,1)}
#view{max-width:760px;margin:0 auto;padding:16px 16px 70px}

.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--pri-ink)}
.tools-top{display:flex;gap:8px}
.ib{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--edge);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));transition:transform .2s}
.ib:active{transform:scale(.9)}

.avatar{--s:44px;position:relative;display:block;flex:none;width:var(--s);height:var(--s);padding:3px;border-radius:50%;overflow:hidden;cursor:zoom-in;background:var(--surface2);border:1px solid var(--edge)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;opacity:0;transition:opacity .3s}
.avatar img.ok{opacity:1}
.avatar.sm{--s:26px;padding:2px}
.avatar.lg{--s:96px;padding:4px}

@media(min-width:960px){
  .mtop,.seg{display:none}
  .shell{display:grid;grid-template-columns:268px minmax(0,1fr)}
  .side{display:block;position:sticky;top:0;height:100vh;padding:16px 0 16px 16px}
  .side .panel{height:100%;display:flex;flex-direction:column;gap:6px;padding:18px 14px}
  .side .brand{padding:2px 6px 18px}
  .side .lab{padding:6px 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .nv{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-radius:var(--r2);color:var(--muted);font-weight:500;transition:background .2s,color .2s,transform .2s}
  .nv:hover{background:var(--surface2);color:var(--text)}
  .nv[aria-current=page]{background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 45%,transparent),color-mix(in srgb,var(--pri) 12%,transparent));color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pri) 50%,transparent)}
  .nv .n{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2)}
  .side .sp{flex:1}
  .sbtn{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:var(--r2);background:var(--surface2);border:1px solid var(--edge);color:var(--muted);font-size:14px;width:100%}
  .sbtn kbd{margin-left:auto}
  .side .row2{display:flex;gap:8px;margin-top:6px}
  #view{padding:28px 32px 70px;max-width:1120px}
  
  @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg) scale(1.1); } 75% { transform: rotate(8deg) scale(1.1); } }
  .nv:hover svg { animation: wiggle 0.4s ease-in-out; color: var(--pri); }
}
kbd{font:500 11px var(--font-family);padding:2px 7px;border-radius:7px;border:1px solid var(--edge);background:var(--surface2);color:var(--muted)}

/* ===== HERO ===== */
.hero{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:flex-end;min-height:230px;padding:22px;border-radius:var(--radius);border:1px solid var(--edge);box-shadow:var(--shadow)}
.hbg{position:absolute;inset:0;z-index:-3}
.hbg i{position:absolute;inset:0;background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,7,13,.05) 15%,rgba(8,7,13,.86))}
.orb{position:absolute;z-index:-2;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:var(--pri);filter:blur(50px);opacity:.4}
.hrow{display:flex;align-items:flex-end;gap:16px;width:100%;min-width:0}

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

.htile{display:grid;place-items:center;width:64px;height:64px;flex:none;border-radius:18px;overflow:hidden;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px); animation: float 4s ease-in-out infinite;}
.htile img{width:100%;height:100%;object-fit:cover}
.hero .avatar.lg { --s: 64px; padding: 2px; animation: float 4s ease-in-out infinite; }

.htxt{min-width:0;color:#fff; display:flex; flex-direction:column; justify-content:center;}
.kick{position:absolute; top:22px; left:22px; z-index:5; display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

.hero h1{font-size:clamp(26px,6vw,40px);line-height:1.15;letter-spacing:-.01em;background:linear-gradient(135deg,var(--text-g1),var(--text-g2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))}
.hero p{margin-top:4px;font-size:14px;color:rgba(255,255,255,.86);max-width:56ch}

@media(min-width:960px){.hero{min-height:290px;padding:32px}.htile{width:80px;height:80px}.hero .avatar.lg{--s:80px}.kick{top:32px;left:32px}}

/* ===== THANH CÔNG CỤ ===== */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 12px}
.sbox{flex:1 1 220px;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:999px}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:15px}
.sbox input::placeholder{color:var(--muted)}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox .clr[hidden]{display:none}
.ctl{display:flex;gap:8px}
.sortw{position:relative;display:flex;align-items:center;height:48px;border-radius:999px}
.sortw select{appearance:none;-webkit-appearance:none;height:46px;padding:0 38px 0 18px;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:14px;font-weight:500;border-radius:999px;cursor:pointer}
.sortw select option{background:#1a1530;color:#f4f1fb}
.sortw::after{content:"";position:absolute;right:16px;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);pointer-events:none}
.lay{display:flex;gap:2px;padding:3px;height:48px;border-radius:999px;align-items:center}
.lay button{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--muted);transition:background .2s,color .2s}
.lay button.on{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 50%,#ff5d8f));color:var(--on-pri)}

.fol{position:relative;display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;margin:0 -2px;scrollbar-width:none;transition:opacity .25s}
.fol::-webkit-scrollbar{display:none}
.fol.dim{opacity:.45}
.fchip{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 14px;border-radius:var(--r3);border:1px solid var(--edge);background:var(--surface);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));font-weight:500;font-size:14px;white-space:nowrap;transition:transform 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s;}
.fchip:hover { transform: translateY(-2px); }
.fchip:active{transform:scale(.94)}
.fchip .n{font-size:11px;min-width:22px;text-align:center;padding:1px 7px;border-radius:99px;background:var(--surface2)}
.fchip.on{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 45%,#ff5d8f));color:var(--on-pri);border-color:transparent;box-shadow:0 8px 22px color-mix(in srgb,var(--pri) 38%,transparent)}
.fchip.on .n{background:rgba(255,255,255,.35)}
.fchip.sv svg{color:var(--gold)}
.fchip.on.sv svg{color:var(--on-pri)}

.sec{display:flex;align-items:baseline;gap:12px;margin:14px 2px 14px}
.sec .no{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--pri-ink)}
.sec h2{font-size:20px;letter-spacing:.01em}
.sec .ln{flex:1;height:1px;background:var(--edge);align-self:center}
.sec .cnt{font-size:13px;color:var(--muted)}

/* ===== THẺ ===== */
.items{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.rv{opacity:1}

.card{position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:var(--radius);background:var(--surface);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--edge);box-shadow:var(--shadow);transition:border-color .25s, transform .2s ease-out;}
.card:hover{border-color:color-mix(in srgb,var(--pri) 60%,transparent);}

.media{position:relative;overflow:hidden;aspect-ratio:16/10;cursor:pointer;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1,#7c5cff),var(--c2,#26136b))}
.media .init{font-size:46px;font-weight:700;color:rgba(255,255,255,.9);text-shadow:0 2px 12px rgba(0,0,0,.25)}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s,transform .4s}
.media img.ok,.media video{opacity:1}
.card:hover .media img,.card:hover .media video{transform:scale(1.04)}
.media::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(8,7,13,.6));pointer-events:none}
.tag{position:absolute;z-index:1;left:10px;bottom:10px;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--gold);background:rgba(10,8,20,.72);border:1px solid color-mix(in srgb,var(--gold) 70%,transparent)}
.pcount{position:absolute;z-index:1;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;background:rgba(10,8,20,.72);border:1px solid rgba(255,255,255,.2)}
.favb{position:absolute;z-index:3;right:10px;top:10px;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:#fff;background:rgba(10,8,20,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);transition:transform .2s,color .2s}
.favb:active{transform:scale(.8)}
.favb.on{color:var(--gold)}
.cbody{flex:1;min-width:0;padding:14px 16px 4px;cursor:pointer}
.cbody h3{font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbody small{display:block;margin:2px 0 6px;color:var(--pri-ink);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbody p{color:var(--muted);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cfoot{position:relative;z-index:3;display:flex;gap:8px;padding:10px 16px 16px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:0;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--edge);background:var(--surface2);color:var(--text);font-weight:700;font-size:13px;white-space:nowrap;transition:transform .2s,filter .2s}
.btn:active{transform:scale(.95)}
.btn .t{overflow:hidden;text-overflow:ellipsis}
.btn.pri{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 50%,#ff5d8f));color:var(--on-pri);border-color:transparent;box-shadow:0 8px 20px color-mix(in srgb,var(--pri) 34%,transparent)}

@keyframes shine { 0% { left: -100%; } 20%, 100% { left: 200%; } }
.btn.pri::after { content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transform: skewX(-20deg); animation: shine 3s infinite; pointer-events: none; }

.btn.grow{flex:1}
.btn.icon{width:40px;padding:0;flex:none}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 65%)}

.items.list{grid-template-columns:1fr;gap:12px}
.list .card{flex-direction:row;align-items:stretch}
.list .media{width:104px;aspect-ratio:auto;flex:none}
.list .media .init{font-size:28px}
.list .tag,.list .pcount,.list .media::after{display:none}
.list .favb{display:none}
.list .cbody{display:flex;flex-direction:column;justify-content:center;padding:12px 14px}
.list .cfoot{flex-direction:column;justify-content:center;padding:12px 12px 12px 0}
.list .cfoot .btn{width:40px;padding:0}
.list .cfoot .btn .t{display:none}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:44px 16px;text-align:center;color:var(--muted)}
.empty svg{opacity:.7}

/* ===== TAB THÔNG TIN ===== */
.bento{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tile{position:relative;display:flex;align-items:center;gap:14px;padding:16px;overflow:hidden;border-radius:var(--radius);background:var(--surface);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--edge);box-shadow:var(--shadow);transition:transform .2s ease-out, border-color .25s}
.tile:hover{border-color:color-mix(in srgb,var(--pri) 60%,transparent);transform:translateY(-2px)}
.tile:active{transform:scale(.97)}
.tile .stretch{position:absolute;inset:0;z-index:1}
.tile .ico{display:grid;place-items:center;width:56px;height:56px;flex:none;border-radius:var(--r2);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.3)}
.tile .tx{flex:1;min-width:0}
.tile .tx b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tx small{display:block;color:var(--pri-ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .go{position:relative;z-index:2;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--muted);background:var(--surface2);border:1px solid var(--edge);transition:color .2s,transform .2s}
.tile .go:hover{color:var(--text)}
.tile .go:active{transform:scale(.85)}
.embed{grid-column:1/-1;padding:12px;border-radius:var(--radius)}
.embed .eh{display:flex;align-items:center;gap:8px;padding:2px 6px 10px;font-weight:700;font-size:14px}
.embed .eh small{font-weight:400;color:var(--muted)}
.embed iframe{display:block;width:100%;border:0;border-radius:var(--r2)}
.embed iframe.yt{aspect-ratio:16/9}
.foot{margin-top:40px;text-align:center;font-size:12px;color:var(--muted)}

/* ===== OVERLAY & GALLERY PREVIEW ===== */
.dlg{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:rgba(5,4,10,.66);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.dlg.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(580px,100%);max-height:92vh;overflow-y:auto;scrollbar-width:none;background:var(--sheet);border:1px solid var(--edge);border-radius:var(--radius) var(--radius) 0 0;box-shadow:0 -10px 60px rgba(0,0,0,.5)}
.sheet::-webkit-scrollbar{display:none}
.dlg.on .sheet{animation:sheetin .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes sheetin{from{transform:translateY(40px) scale(.98);opacity:0}}
@media(min-width:700px){.dlg{align-items:center;padding:24px}.sheet{border-radius:var(--radius)}}
.grab{display:block;width:44px;height:5px;border-radius:9px;background:var(--edge);margin:10px auto 0}
@media(min-width:700px){.grab{display:none}}
.smedia{position:relative;aspect-ratio:16/9;margin:10px 10px 0;border-radius:var(--r2);overflow:hidden;cursor:zoom-in;background:linear-gradient(135deg,var(--c1,#7c5cff),var(--c2,#26136b))}
.smedia img,.smedia video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.smedia .nav{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#fff;background:rgba(10,8,20,.65);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);z-index:2;transition:transform .15s,background .2s}
.smedia .nav:active{transform:translateY(-50%) scale(.9)}
.smedia .nav.l{left:10px}.smedia .nav.r{right:10px}
.smedia .pos{position:absolute;left:10px;top:10px;z-index:2;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;background:rgba(10,8,20,.65);border:1px solid rgba(255,255,255,.15)}

.sgal::-webkit-scrollbar{display:none}
.sgal-it{position:relative;flex:none;width:76px;aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:2px solid transparent;opacity:.55;cursor:pointer;background:var(--surface2);transition:opacity .2s,border-color .2s,transform .2s}
.sgal-it:hover{opacity:.85}
.sgal-it.on{opacity:1;border-color:var(--pri);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.sgal-it img,.sgal-it video{width:100%;height:100%;object-fit:cover}

.sx{position:absolute;z-index:5;right:14px;top:14px}
.sbody{padding:16px 22px 24px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tg{padding:2px 11px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.04em;background:var(--surface2);border:1px solid var(--edge);color:var(--pri-ink)}
.tg.g{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.tg.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.sbody h2{font-size:22px;line-height:1.3}
.sbody .sub{margin:2px 0 14px;color:var(--pri-ink);font-size:14px;font-weight:500}
.sbody .lab{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sbody .lab::after{content:"";flex:1;height:1px;background:var(--edge)}
.sbody .desc{font-size:14px;line-height:1.65;color:var(--text);opacity:.88;white-space:pre-wrap;margin-bottom:20px}
.sacts{display:flex;flex-direction:column;gap:10px}
.sacts .btn{height:46px;font-size:14px;width:100%}
.srow{display:flex;gap:8px;margin-top:12px}
.srow .btn{flex:1;height:40px;font-weight:500}
.srow .btn.on{color:var(--gold)}
.wsheet{padding:30px 24px 24px;text-align:center;border-radius:var(--radius);width:min(380px,100%)}
@media(max-width:699px){.dlg.w{align-items:center;padding:16px}}
.glow{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 18px;border-radius:50%;color:var(--gold);background:linear-gradient(135deg,rgba(252,211,77,.22),rgba(252,211,77,.05));border:1px solid rgba(252,211,77,.35);box-shadow:0 0 28px rgba(252,211,77,.22)}
.wsheet h2{font-size:22px;margin-bottom:8px}
.wsheet p{font-size:14px;color:var(--muted);margin-bottom:22px;line-height:1.55}

/* Lightbox hỗ trợ chuyển ảnh */
.lb{position:fixed;inset:0;z-index:95;display:none;place-items:center;padding:64px 16px 24px;background:rgba(6,5,12,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);cursor:zoom-out}
.lb.on{display:grid;animation:fade .2s}
.lb figure{display:grid;gap:14px;justify-items:center;max-width:100%;position:relative}
.lb img,.lb video{max-width:min(94vw,960px);max-height:76vh;object-fit:contain;border-radius:var(--r2);border:1px solid var(--edge);box-shadow:0 24px 60px rgba(0,0,0,.55);background:rgba(255,255,255,.05)}
.lb figcaption{padding:6px 16px;border-radius:99px;font-size:14px;font-weight:500;color:#fff;background:rgba(255,255,255,.12)}
.lb .ib{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px))}
.lb .lb-nav{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);z-index:3}
.lb .lb-nav.l{left:14px}.lb .lb-nav.r{right:14px}

.pal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:11vh 14px 14px;background:rgba(5,4,10,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pal.on{display:flex;animation:fade .15s}
.pbox{width:min(620px,100%);max-height:72vh;display:flex;flex-direction:column;overflow:hidden;background:var(--sheet);border:1px solid var(--edge);border-radius:var(--radius);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.pal.on .pbox{animation:sheetin .3s cubic-bezier(.2,.9,.3,1.15)}
.phead{display:flex;align-items:center;gap:12px;padding:0 18px;height:58px;border-bottom:1px solid var(--edge);color:var(--muted)}
.phead input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px}
.plist{overflow-y:auto;padding:8px}
.prow{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r3);cursor:pointer}
.prow.sel{background:color-mix(in srgb,var(--pri) 20%,transparent)}
.pth{position:relative;display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:11px;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--c1,#7c5cff),var(--c2,#26136b))}

.prow .tx{flex:1;min-width:0}
.prow .tx b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tx small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfoot{display:flex;gap:14px;padding:10px 18px;border-top:1px solid var(--edge);font-size:12px;color:var(--muted)}

.toast{position:fixed;z-index:120;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);display:flex;align-items:center;gap:8px;max-width:calc(100% - 28px);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.3,1.5,.5,1)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){

html { scroll-behavior: smooth; }
@keyframes smoothFadeUp {

  to { opacity: 1; transform: translateY(0) scale(1); }
}
.card, .tile {
  animation: smoothFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) backwards;

}
.card:hover, .tile:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5) !important;

}
@keyframes sheetin {
  from { transform: translateY(80px) scale(0.95); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}
.dlg.on .sheet, .pal.on .pbox {
  animation: sheetin 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
}
#view {

}

}
.avatar img, .media img, .media video {
  transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1) !important;

function norm(raw) {
  let i = raw || {};

  const title = (i.title || i.name || "Không tên").trim();
  const by = i.by || CONFIG.name;
  let actions = Array.isArray(i.actions) ? i.actions.filter(a => a && a.url && a.url !== "#").map(a => ({ label: a.label || "Tải xuống", url: a.url, primary: !!a.primary })) : [];

  if (i.zalith) {
    const a0 = actions[0], a1 = actions[1];
    const dl = i.source || i.url || (a0 && a0.url);
    const gh = i.github || (a1 && a1.url);
    actions = [];
    if (dl) actions.push({ label: "Tải bản mới nhất", url: dl, primary: true });
    if (gh) actions.push({ label: "GitHub", url: gh, kind: "out" });
    website = "";
  } else if (!i.title && i.url && !actions.length) {
    actions = [{ label: "Tải xuống", url: i.url, primary: true }];
  }

  // Gom ảnh Thumbnail + Banner + danh sách PreviewImages (loại trùng lặp)
  const rawPreviews = Array.isArray(i.previewImages)
    ? i.previewImages
    : (typeof i.previewImages === "string" ? i.previewImages.split(/\r?\n/) : []);
  const gallery = [];
  const pushImg = u => {
    const s = String(u || "").trim();
    if (s && !gallery.includes(s)) gallery.push(s);
  };
  pushImg(i.banner);
  pushImg(i.image);
  rawPreviews.forEach(pushImg);

  const image = i.image || gallery[0] || "";
  const metaExtra = i.metaExtra || [i.publisher, i.price].filter(Boolean).join(" · ") || "";

  return {
    title,
    subtitle: i.subtitle || "by " + by,
    description: i.description || i.desc || "",

    banner: i.banner || "",

}

  if (!isFirst) {
    viewEl.classList.add("fade-out"); // Bắt đầu hiệu ứng mờ đi
    setTimeout(() => {
      view(); // Đổi nội dung HTML
      window.scrollTo({ top: 0, behavior: "smooth" });
      requestAnimationFrame(() => viewEl.classList.remove("fade-out")); // Hiện mượt lên lại
    }, 200); // Đợi 200ms cho mờ hẳn rồi mới đổi
  } else {
    view();
  }
  first = false;
}
function goto(t, f) {
  const tab = CONFIG.tabs[t];
  location.hash = "#" + t + (tab.folders && f ? "/" + f : "");
}

/* ============ KHUNG ĐIỀU HƯỚNG ============ */
function brandEl() {
  const b = el("div", "brand"); b.append(avatarEl());
  const t = el("div"); const n = el("b", "", CONFIG.name || ""); const s = el("small", "", "Minecraft hub"); t.append(n, s); b.append(t); return b;
}
function buildNav() {
  const side = $("side"), panel = el("div", "panel glass");
  panel.append(brandEl(), el("div", "lab", "Danh mục"));
  TABS.forEach(k => {
    const a = el("a", "nv"); a.href = "#" + k; a.dataset.k = k; a.innerHTML = svg(k, 20);
    a.append(el("span", "", CONFIG.tabs[k].label), el("span", "n", String(countOf(k)))); panel.append(a);
  });
  panel.append(el("div", "sp"));
  const sb = el("button", "sbtn"); sb.type = "button"; sb.innerHTML = svg("search", 18) + "<span>Tìm kiếm nhanh</span><kbd>Ctrl K</kbd>"; sb.onclick = openPal;
  const row = el("div", "row2"); const th = el("button", "sbtn js-theme"); th.type = "button"; th.onclick = toggleTheme;
  row.append(th); panel.append(sb, row); side.append(panel);
  th.style.justifyContent = "center";
  const top = $("mtop"); top.append(brandEl());

  const s2 = el("button", "ib"); s2.type = "button"; s2.innerHTML = svg("search", 20); s2.setAttribute("aria-label", "Tìm kiếm"); s2.onclick = openPal;
  const t2 = el("button", "ib js-theme"); t2.type = "button"; t2.onclick = toggleTheme;
  tools.append(s2, t2); top.append(tools);
  const seg = $("seg"); const g = el("span", "glider"); g.id = "glider"; seg.append(g);
  TABS.forEach(k => { const a = el("a"); a.href = "#" + k; a.dataset.k = k; a.innerHTML = svg(k, 18); a.append(el("span", "", CONFIG.tabs[k].label)); seg.append(a); });
}
function syncNav() {
  document.querySelectorAll("[data-k]").forEach(a => { if (a.dataset.k === S.tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  glide();
}
function glide(first_) {
  const a = document.querySelector('#seg a[aria-current="page"]'), g = $("glider"); if (!a || !g || !a.offsetWidth) return;
  if (first_) g.style.transition = "none";
  g.style.width = a.offsetWidth + "px"; g.style.height = a.offsetHeight + "px"; g.style.top = a.offsetTop + "px"; g.style.transform = "translateX(" + a.offsetLeft + "px)";
  if (first_) { void g.offsetWidth; g.style.transition = ""; }
}

/* ============ VIEW ============ */
function heroEl(tab) {
  const h = el("section", "hero"); const bg = el("div", "hbg"); const bi = el("i");
  const g = tab.grad || ["#7c5cff", "#1b1050"];
  bg.style.background = "linear-gradient(135deg," + g[0] + "," + g[1] + ")";
  if (tab.bannerImg) bi.style.backgroundImage = 'url("' + String(tab.bannerImg).replace(/"/g, "%22") + '")';
  bg.append(bi);

  const k = el("span", "kick"); k.innerHTML = svg(S.tab, 14); k.append(document.createTextNode(tab.label));

  const row = el("div", "hrow"); let lead;
  if (tab.iconImg) { lead = el("span", "htile"); const im = el("img"); im.alt = ""; im.referrerPolicy = "no-referrer"; im.src = tab.iconImg; im.onerror = () => { im.remove(); lead.innerHTML = svg(S.tab, 34); }; lead.append(im); }
  else if (tab.links) lead = avatarEl("lg");
  else { lead = el("span", "htile"); lead.innerHTML = svg(S.tab, 38); }

  const m = el("div", "htxt");
  m.append(el("h1", "", tab.title), el("p", "", tab.sub));

}
function toolsEl() {
  const w = el("div", "tools");
  const sb = el("label", "sbox glass"); sb.style.borderRadius = "999px"; sb.innerHTML = svg("search", 20);
  const inp = el("input"); inp.type = "search"; inp.placeholder = "Tìm trong " + CONFIG.tabs[S.tab].label + "…"; inp.value = S.q; inp.setAttribute("aria-label", "Tìm kiếm");
  const clr = el("button", "clr"); clr.type = "button"; clr.hidden = !S.q; clr.innerHTML = svg("x", 18); clr.setAttribute("aria-label", "Xoá");
  sb.append(inp, clr);
  inp.oninput = () => { S.q = inp.value; clr.hidden = !S.q; document.querySelector(".fol") && document.querySelector(".fol").classList.toggle("dim", !!S.q.trim()); refreshList(); };
  clr.onclick = e => { e.preventDefault(); inp.value = ""; inp.oninput(); inp.focus(); };
  const ctl = el("div", "ctl");
  const sw = el("div", "sortw glass"); sw.style.borderRadius = "999px";
  const sel = el("select"); sel.setAttribute("aria-label", "Sắp xếp");
  [["def", "Mặc định"], ["az", "A → Z"], ["za", "Z → A"]].forEach(o => sel.add(new Option(o[1], o[0])));
  sel.value = S.sort; sel.onchange = () => { S.sort = sel.value; ls.set("kt_sort", S.sort); refreshList(); }; sw.append(sel);
  const lay = el("div", "lay glass"); lay.style.borderRadius = "999px";
  [["grid", "gridv"], ["list", "list"]].forEach(([k, ic]) => {
    const b = el("button", S.layout === k ? "on" : ""); b.type = "button"; b.innerHTML = svg(ic === "gridv" ? "grid" : ic, 18); b.setAttribute("aria-label", k === "grid" ? "Dạng lưới" : "Dạng danh sách");
    b.onclick = () => { S.layout = k; ls.set("kt_layout", k); lay.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on"); refreshList(); }; lay.append(b);
  });
  ctl.append(sw, lay); w.append(sb, ctl); return w;
}
function foldersEl(tab) {
  const w = el("nav", "fol"); w.setAttribute("aria-label", "Danh mục");
  tab.folders.forEach(f => {
    const b = el("button", "fchip"); b.type = "button"; b.dataset.f = f.id; b.innerHTML = svg(FICON[f.id] || "folder", 18);
    b.append(el("span", "", f.name), el("span", "n", String((f.items || []).length)));
    b.onclick = () => { location.hash = "#" + S.tab + "/" + f.id; }; w.append(b);
  });
  const sv = el("button", "fchip sv"); sv.type = "button"; sv.dataset.f = "saved"; sv.innerHTML = svg("star", 18, true);
  sv.append(el("span", "", "Đã lưu"), el("span", "n", String(entriesOf(S.tab).filter(e => favs.has(e.id)).length)));
  sv.onclick = () => { location.hash = "#" + S.tab + "/saved"; }; w.append(sv);
  return w;
}
function syncFolders() {
  document.querySelectorAll(".fchip").forEach(c => c.classList.toggle("on", c.dataset.f === S.folder));
  const on = document.querySelector(".fchip.on"); if (on) { const w = on.parentNode; w.scrollTo ? w.scrollTo({ left: on.offsetLeft - (w.clientWidth - on.offsetWidth) / 2, behavior: reduce ? "auto" : "smooth" }) : (w.scrollLeft = on.offsetLeft - (w.clientWidth - on.offsetWidth) / 2); }
  const f = document.querySelector(".fol"); if (f) f.classList.toggle("dim", !!S.q.trim());
}
function view() {
  const tab = CONFIG.tabs[S.tab], root = $("view"); root.replaceChildren();
  root.append(heroEl(tab));
  if (!tab.links) { root.append(toolsEl(), foldersEl(tab)); }
  const list = el("div"); list.id = "list"; root.append(list);
  const ft = el("p", "foot", "© " + new Date().getFullYear() + " " + CONFIG.name + " · Web V2"); root.append(ft);
  syncNav(); syncFolders(); refreshList();
}

function secEl(no, title, cnt) {
  const s = el("div", "sec"); s.append(el("span", "no", no), el("h2", "", title), el("span", "ln"));
  if (cnt != null) s.append(el("span", "cnt", cnt + " mục")); return s;
}
function emptyEl(msg, ico) { const d = el("div", "empty"); d.innerHTML = svg(ico || "folder", 44); d.append(el("p", "", msg)); return d; }

function refreshList() {
  const L = $("list"); if (!L) return; L.replaceChildren();
  const tab = CONFIG.tabs[S.tab];
  if (tab.links) { shown = []; renderInfo(L, tab); return; }
  const q = fold(S.q.trim()); let pool, no, title;
  if (q) { pool = entriesOf(S.tab).filter(e => fold(e.title + " " + e.subtitle + " " + e.description + " " + e.folder).includes(q)); no = "⌕"; title = "Kết quả"; }
  else if (S.folder === "saved") { pool = entriesOf(S.tab).filter(e => favs.has(e.id)); no = "★"; title = "Đã lưu"; }
  else { const fi = tab.folders.findIndex(f => f.id === S.folder); pool = entriesOf(S.tab, S.folder); no = String(fi + 1).padStart(2, "0"); title = fi >= 0 ? tab.folders[fi].name : ""; }
  if (S.sort === "az") pool.sort((a, b) => a.title.localeCompare(b.title, "vi")); else if (S.sort === "za") pool.sort((a, b) => b.title.localeCompare(a.title, "vi"));
  shown = pool;
  L.append(secEl(no, title, pool.length));
  if (!pool.length) {
    L.append(emptyEl(q ? "Không tìm thấy kết quả cho “" + S.q.trim() + "”." : S.folder === "saved" ? "Bạn chưa lưu mục nào. Bấm ★ trên thẻ để lưu lại." : "Thư mục này chưa có mục nào.", q ? "search" : S.folder === "saved" ? "star" : "folder"));
    return;
  }
  const g = el("div", "items" + (S.layout === "list" ? " list" : ""));
  pool.forEach((e, i) => g.append(cardEl(e, i))); L.append(g);
}

function cardEl(e, idx) {
  const c = el("article", "card rv");
  const m = el("div", "media"); tint(m, e.title);
  m.append(el("span", "init", (e.title || "?").charAt(0).toUpperCase()), pic(e.image, e.title), el("span", "tag", e.folder));
  if (e.gallery && e.gallery.length > 1) {
    const pc = el("span", "pcount");
    pc.innerHTML = svg("eye", 12) + "<span>" + e.gallery.length + "</span>";
    m.append(pc);
  }
  m.onclick = () => openDetail(idx);
  const fav = el("button", "favb" + (favs.has(e.id) ? " on" : "")); fav.type = "button"; fav.dataset.fav = e.id; fav.dataset.s = 18; fav.innerHTML = svg("star", 18, favs.has(e.id)); fav.setAttribute("aria-label", "Lưu");
  fav.onclick = ev => { ev.stopPropagation(); toggleFav(e.id); }; m.append(fav);
  const b = el("div", "cbody"); b.append(el("h3", "", e.title), el("small", "", e.subtitle)); if (e.description) b.append(el("p", "", e.description)); b.onclick = () => openDetail(idx);
  const f = el("div", "cfoot"); const main = e.actions[0];
  if (main) { const a = el("a", "btn pri grow"); ext(a, main.url); a.innerHTML = svg("dl", 17); a.append(el("span", "t", main.label)); a.title = main.label; a.setAttribute("aria-label", main.label + " " + e.title); a.onclick = () => toast("Đang mở: " + e.title, "dl"); f.append(a); }
  const d = el("button", "btn" + (main ? " icon" : " grow")); d.type = "button"; d.innerHTML = svg(main ? "info" : "layers", 18); d.setAttribute("aria-label", "Chi tiết " + e.title); d.title = "Chi tiết";
  if (!main) d.append(el("span", "t", "Xem chi tiết")); d.onclick = () => openDetail(idx); f.append(d);
  c.append(m, b, f); 
  c.style.animationDelay = (idx * 0.05) + "s";
  return c;
}

const isMedia = l => l.app === "spotify" || l.app === "youtubemusic";
function ytEmbed(u) {
  try { const x = new URL(u); let id = x.searchParams.get("v"); const list = x.searchParams.get("list");
    if (!id && x.hostname.includes("youtu.be")) id = x.pathname.slice(1);
    if (id) return "https://www.youtube.com/embed/" + encodeURIComponent(id) + (list ? "?list=" + encodeURIComponent(list) : "");
    if (list) return "https://www.youtube.com/embed/videoseries?list=" + encodeURIComponent(list); } catch (e) {} return "";
}
function spEmbed(u) { try { const x = new URL(u); return "https://open.spotify.com/embed" + x.pathname.replace(/^\/intl-[a-z-]+/i, "").replace(/^\/embed/, ""); } catch (e) { return ""; } }
function embedEl(l) {
  const w = el("div", "embed glass"); const h = el("div", "eh"); h.innerHTML = svg("music", 18); h.append(el("span", "", l.name || "Phát nhạc"));
  if (l.desc) h.append(el("small", "", l.desc)); w.append(h);
  const fr = document.createElement("iframe"); fr.loading = "lazy"; fr.setAttribute("allowfullscreen", "");
  if (l.app === "spotify") { fr.src = spEmbed(l.url); fr.height = /\/(playlist|album|show)\//.test(l.url) ? 352 : 152; fr.allow = "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"; fr.title = "Spotify"; }
  else { fr.src = ytEmbed(l.url); fr.className = "yt"; fr.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"; fr.title = "YouTube"; }
  if (!fr.src) return linkTile(l);
  w.append(fr); return w;
}
function linkTile(l) {
  const t = el("article", "tile rv"); t.append(appTile(l.app));
  const tx = el("div", "tx"); tx.append(el("b", "", l.name), el("small", "", l.desc || "")); t.append(tx);
  const a = el("a", "stretch"); ext(a, l.url); a.setAttribute("aria-label", l.name); t.append(a);
  const cp = el("button", "go"); cp.type = "button"; cp.innerHTML = svg("copy", 17); cp.setAttribute("aria-label", "Chép link " + l.name); cp.title = "Chép link";
  cp.onclick = e => { e.stopPropagation(); copyText(l.url, "Đã chép link " + l.name); }; t.append(cp);
  t.style.animationDelay = (Math.random() * 0.15) + "s";
  return t;
}
function renderInfo(L, tab) {
  const links = tab.links || [], normal = links.filter(l => !isMedia(l)), media = links.filter(isMedia);
  L.append(secEl("01", "Liên hệ", normal.length));
  const g = el("div", "bento");
  if (!normal.length) g.append(emptyEl("Chưa có liên kết nào.", "link"));
  normal.forEach(l => g.append(linkTile(l)));
  L.append(g);
  if (media.length) { L.append(secEl("02", "Âm nhạc & Video", media.length)); const g2 = el("div", "bento"); media.forEach(m => g2.append(embedEl(m))); L.append(g2); }
}

/* ============ HIỆU ỨNG ============ */
document.addEventListener("pointerdown", e => {
  if (reduce) return; const t = e.target.closest(".btn,.fchip,.seg a"); if (!t) return;
  const r = t.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2, s = el("span", "ripple");
  s.style.cssText = "width:" + d + "px;height:" + d + "px;left:" + (e.clientX - r.left - d / 2) + "px;top:" + (e.clientY - r.top - d / 2) + "px";
  if (getComputedStyle(t).position === "static") t.style.position = "relative"; t.style.overflow = "hidden"; t.append(s);
  const a = anim(s, [{ transform: "scale(0)", opacity: .9 }, { transform: "scale(1)", opacity: 0 }], { duration: 600, easing: "ease-out" });
  if (a) a.onfinish = () => s.remove(); else s.remove();
});

addEventListener("scroll", () => { const h = document.documentElement, m = h.scrollHeight - h.clientHeight; $("prog").style.transform = "scaleX(" + (m > 0 ? h.scrollTop / m : 0) + ")"; }, { passive: true });

/* ============ COMMAND PALETTE ============ */
let prow = [], psel = 0;
$("pal-ic").innerHTML = svg("search", 20);
function openPal() { $("pin").value = ""; palRender(); openOv($("pal")); setTimeout(() => $("pin").focus(), 30); }
function closePal() { closeOv($("pal")); }
function palRender() {
  const q = fold($("pin").value.trim()); prow = [];
  if (!q) {
    TABS.forEach(t => prow.push({ ico: t, title: "Đi tới " + CONFIG.tabs[t].label, sub: CONFIG.tabs[t].title, run: () => goto(t) }));
    const st = hasFolders(S.tab) ? S.tab : TABS.find(hasFolders);
    if (st) prow.push({ ico: "star", title: "Mục đã lưu", sub: "Trong " + CONFIG.tabs[st].label, run: () => goto(st, "saved") });
    prow.push({ ico: document.documentElement.dataset.theme === "light" ? "moon" : "sun", title: "Đổi giao diện sáng / tối", sub: "", run: toggleTheme });
  } else {
    TABS.forEach(t => {
      const tab = CONFIG.tabs[t];
      if (tab.links) tab.links.forEach(l => { if (fold(l.name + " " + (l.desc || "")).includes(q)) prow.push({ ico: "link", app: l.app, title: l.name, sub: (l.desc || "") + " · " + tab.label, run: () => window.open(l.url, "_blank", "noopener") }); });
      else entriesOf(t).forEach(e => { if (fold(e.title + " " + e.subtitle + " " + e.description + " " + e.folder).includes(q)) prow.push({ img: e.image, title: e.title, sub: e.folder + " · " + tab.label, run: () => { goto(e.tab, e.folderId); const i = shown.findIndex(x => x.id === e.id); if (i >= 0) openDetail(i); } }); });
    });
    prow = prow.slice(0, 40);
  }
  psel = 0; palDraw();
}
function palDraw() {
  const L = $("plist"); L.replaceChildren();
  if (!prow.length) { L.append(emptyEl("Không có kết quả.", "search")); return; }
  prow.forEach((r, i) => {
    const d = el("div", "prow" + (i === psel ? " sel" : "")); let th;
    if (r.app) th = appTile(r.app, "pth"); else { th = el("span", "pth"); tint(th, r.title); if (r.img) th.append(pic(r.img, r.title)); else th.innerHTML = svg(r.ico || "link", 20); }
    const tx = el("div", "tx"); tx.append(el("b", "", r.title)); if (r.sub) tx.append(el("small", "", r.sub));
    d.append(th, tx); d.onmousemove = () => { if (psel !== i) { psel = i; L.querySelectorAll(".prow").forEach((n, k) => n.classList.toggle("sel", k === i)); } };
    d.onclick = () => { closePal(); r.run(); }; L.append(d);
  });
  const s = L.querySelector(".sel"); if (s && s.scrollIntoView) s.scrollIntoView({ block: "nearest" });
}
$("pin").addEventListener("input", palRender);
$("pin").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); psel = Math.min(prow.length - 1, psel + 1); palDraw(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); psel = Math.max(0, psel - 1); palDraw(); }
  else if (e.key === "Enter") { e.preventDefault(); const r = prow[psel]; if (r) { closePal(); r.run(); } }
});
$("pal").addEventListener("mousedown", e => { if (e.target === $("pal")) closePal(); });

/* ============ PHÍM TẮT ============ */
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("pal").classList.contains("on") ? closePal() : openPal(); return; }
  if (e.key === "/" && !typing && !$("pal").classList.contains("on")) { e.preventDefault(); openPal(); return; }
  if (e.key === "Escape") {
    if ($("lb").classList.contains("on")) closeLB(); else if ($("pal").classList.contains("on")) closePal();
    else if ($("dlg").classList.contains("on")) closeDetail(); else if ($("welcome").classList.contains("on")) closeWelcome();
  }
  if ($("lb").classList.contains("on") && !typing) {
    if (e.key === "ArrowLeft") stepLB(-1); else if (e.key === "ArrowRight") stepLB(1);
    return;
  }
  if ($("dlg").classList.contains("on") && !typing) { if (e.key === "ArrowLeft") stepDetail(-1); else if (e.key === "ArrowRight") stepDetail(1); }
});

/* ============ POPUP CHÀO MỪNG ============ */
function closeWelcome() { closeOv($("welcome")); }
$("w-btn").onclick = closeWelcome;
$("welcome").addEventListener("click", e => { if (e.target === $("welcome")) closeWelcome(); });
setTimeout(() => {
  const w = CONFIG.welcome || {}; if (w.active === false) return;
  $("w-title").textContent = w.title || "Thông báo"; $("w-desc").textContent = w.desc || "";
  $("w-btn").textContent = w.btn || "Tiếp tục"; openOv($("welcome"));
}, 400);

/* ============ KHỞI ĐỘNG ============ */
buildNav();
setTheme(ls.get("kt_theme", "dark") === "light" ? "light" : "dark");
addEventListener("hashchange", route);
addEventListener("resize", () => glide(true));
route();
requestAnimationFrame(() => glide(true));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => glide(true));
</script>
