<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0a14">
<title>Trang cá nhân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a14;--text:#f2eefb;--muted:#bdb5d1;--pri:#c4b5fd;--on-pri:#24104f;--gold:#fcd34d;color-scheme:dark;
  --glass:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.04) 55%,rgba(255,255,255,.1));--edge:rgba(255,255,255,.2)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1,h2,b,.init{font-family:Lexend,Roboto,system-ui,sans-serif}
#view{max-width:720px;margin:0 auto;padding:0 16px 140px}

/* Nền phía sau */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle 46vmax at 8% 4%,rgba(124,92,255,.5),transparent 65%),
    radial-gradient(circle 40vmax at 100% 30%,rgba(255,93,143,.3),transparent 65%),
    radial-gradient(circle 50vmax at 20% 100%,rgba(34,211,197,.24),transparent 65%),
    radial-gradient(circle 36vmax at 92% 96%,rgba(124,92,255,.32),transparent 65%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle 54px at 93% 26%,rgba(255,93,143,.6) 0 96%,transparent 100%),
    radial-gradient(circle 40px at 6% 58%,rgba(34,211,197,.5) 0 96%,transparent 100%),
    radial-gradient(circle 90px at 80% 84%,rgba(124,92,255,.6) 0 96%,transparent 100%)}

/* Các thành phần giao diện cơ bản */
.search, .visit-counter {display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;margin-top:calc(14px + env(safe-area-inset-top,0px));border-radius:999px;color:var(--muted)}
.visit-counter {justify-content:center; color: var(--text); font-weight: 500; font-size: 16px;}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:17px}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.clr{display:flex;padding:4px}
.clr[hidden]{display:none}

.hero{position:relative;overflow:hidden;display:flex;align-items:flex-end;min-height:200px;margin-top:20px;padding:20px;border-radius:28px;
  background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--edge);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 14px 34px rgba(0,0,0,.4)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(12,10,20,.7))}
.hero .big{position:absolute;right:-24px;top:-20px;color:#fff;opacity:.17}
.hero .row{position:relative;z-index:1;display:flex;align-items:center;gap:14px;min-width:0}
.tile{display:grid;place-items:center;width:72px;height:72px;border-radius:20px;flex:none;color:#fff;background:rgba(0,0,0,0.2)}
.hero h1{font-size:22px;line-height:1.25;font-weight:700}
.hero p{font-size:14px;color:rgba(255,255,255,.82)}
.hero .by{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:15px;color:rgba(255,255,255,.88)}
.count{font-size:13px;padding:1px 10px;border-radius:99px;background:rgba(255,255,255,.2)}

.chips{position:relative;display:flex;gap:12px;overflow-x:auto;margin:20px -16px 0;padding:0 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:10px;flex:none;height:48px;padding:0 20px 0 16px;border-radius:999px;color:var(--pri);font-weight:500;font-size:16px;white-space:nowrap}

.sec{display:flex;align-items:center;gap:16px;margin:24px 0 16px;font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sec::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.16)}
.empty{color:var(--muted);padding:8px 2px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stack{display:grid;grid-template-columns:1fr;gap:12px}

.card{display:block;overflow:hidden;border-radius:24px;text-align:left;}
button.card{width:100%;}
a.card:active, button.card:active{opacity:.8}
.thumb{position:relative;overflow:hidden;display:grid;place-items:center;aspect-ratio:16/9;background:linear-gradient(135deg,var(--c1),var(--c2))}
.init{font-size:44px;font-weight:700;color:rgba(255,255,255,.9);line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.lbl{position:absolute;left:8px;bottom:8px;padding:1px 8px;border-radius:6px;background:rgba(12,10,20,.72);border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:500}
.body{position:relative;padding:12px 40px 14px 14px}
.body b{display:block;font-size:15px;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body small{display:block;color:var(--muted);font-size:14px}
.body p{color:var(--muted);font-size:13px;line-height:1.4;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini{position:absolute;right:12px;bottom:12px;color:var(--muted);display:flex}
.card.wide{grid-column:1/-1;display:flex;gap:14px;padding:14px;align-items:flex-start}
.wide .thumb{width:96px;aspect-ratio:1;border-radius:18px;flex:none}
.wide .body{flex:1;min-width:0;padding:0}
.wide .body p{-webkit-line-clamp:4;font-size:14px;margin-top:6px}
.card.rowc{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;border-radius:28px}
.rowc .thumb{width:60px;aspect-ratio:1;border-radius:18px;flex:none}
.rowc .init{font-size:20px}
.rowc .body{flex:1;min-width:0;padding:0}
.rowc .body b{font-size:17px}
.rowc .mini{position:static}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-weight:500;font-size:14px;color:var(--pri)}
.btn:disabled{opacity:.7;cursor:wait}

/* Liquid Glass */
.search,.visit-counter,.chip,.card,.dock,.btn,.toast,.tile,.vclose,.vcap,.avatar,.modal-box{
  background:var(--glass);
  -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.4),inset 0 -1px 1px rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.35)}
.btn{box-shadow:inset 0 1px 1px rgba(255,255,255,.35)}
.chip.on{background:linear-gradient(135deg,rgba(196,181,253,.5),rgba(196,181,253,.2));border-color:rgba(255,255,255,.42);color:#fff}
.btn.main{background:linear-gradient(135deg,#e6dcff,#b59cff);border-color:rgba(255,255,255,.55);color:var(--on-pri);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 6px 18px rgba(124,92,255,.4)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .search,.visit-counter,.chip,.card,.dock,.btn,.toast,.tile,.vclose,.vcap,.avatar,.modal-box{background:rgba(36,28,52,.92)}}

/* Thanh tab */
.dock{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;gap:4px;padding:6px;width:min(420px,calc(100% - 24px));border-radius:999px}
.dock a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px 7px;border-radius:999px;font-size:12px;font-weight:500;color:var(--muted)}
.dock .pill{display:grid;place-items:center;height:26px}
.dock a[aria-current="page"]{color:var(--text);background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.dock a[aria-current="page"] svg{color:var(--pri)}

.toast{position:fixed;z-index:30;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}

html,body{height:100%;overflow:hidden}
#scroller{position:fixed;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;overflow-anchor:none;-webkit-overflow-scrolling:touch}
.card,.chip,.btn,.dock a{position:relative;overflow:hidden;transition:transform .22s cubic-bezier(.3,1.7,.5,1),filter .2s}
a.card:active,button.card:active,.chip:active,.btn:active{opacity:1;transform:scale(.95);filter:brightness(1.18)}
.dock a{z-index:1}
.dock a:active{transform:scale(.9)}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,0) 65%)}
.glider{position:absolute;left:0;top:0;border-radius:999px;pointer-events:none;background:rgba(255,255,255,.17);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 0 1px rgba(255,255,255,.1);
  transition:transform .5s cubic-bezier(.3,1.35,.5,1),width .4s cubic-bezier(.3,1.35,.5,1)}
.dock a[aria-current="page"]{background:none;box-shadow:none}

/* Ảnh: thumbnail, avatar, xem ảnh lớn */
.thumb[data-view]{cursor:zoom-in}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.thumb img.ok,.avatar img.ok{opacity:1}
.avatar{--s:76px;position:relative;display:block;flex:none;width:var(--s);height:var(--s);padding:4px;border-radius:50%;overflow:hidden;cursor:zoom-in}
.avatar img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;opacity:0;transition:opacity .4s}
.avatar.sm{--s:24px;padding:2px;box-shadow:inset 0 1px 1px rgba(255,255,255,.45)}
.viewer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:64px 16px calc(24px + env(safe-area-inset-bottom,0px));
  background:rgba(8,6,16,.74);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);cursor:zoom-out}
.viewer[hidden]{display:none}
.viewer figure{display:grid;gap:14px;justify-items:center;max-width:100%;margin:0}
.viewer img{display:block;min-width:min(80vw,360px);max-width:min(92vw,900px);max-height:74vh;object-fit:contain;border-radius:26px;
  border:1px solid var(--edge);background:rgba(255,255,255,.06);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 24px 60px rgba(0,0,0,.55)}
.vcap{max-width:100%;padding:8px 18px;border-radius:999px;font-size:15px;font-weight:500;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vclose{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;z-index: 10;}

/* CSS CHO MODAL POP-UP CHI TIẾT */
#detail-modal { cursor: default; padding: 24px 16px; }
.modal-box { position: relative; width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto; border-radius: 28px; display: flex; flex-direction: column; }
.modal-box::-webkit-scrollbar { display: none; }
.modal-box .vclose { position: absolute; top: 12px; right: 12px; background: rgba(12,10,20,.6); color: #fff; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
.modal-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; flex: none; display: block; border-bottom: 1px solid rgba(255,255,255,0.1); }
.m-body { padding: 20px 24px 24px; display: flex; flex-direction: column; }
.m-title { font-size: 24px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; color: #fff; }
.m-sub { color: var(--pri); font-size: 15px; font-weight: 500; margin-bottom: 16px; }
.m-desc { font-size: 15px; line-height: 1.6; color: rgba(255,255,255,0.85); margin-bottom: 24px; white-space: pre-wrap; }
.m-acts { display: flex; flex-direction: column; gap: 10px; }
.m-acts .btn { height: 46px; font-size: 15px; width: 100%; }
</style>
</head>

<div id="scroller"><main id="view"></main></div>
<nav class="dock" id="dock" aria-label="Chuyển tab"></nav>
<div class="toast" id="toast" role="status"></div>

<!-- GIAO DIỆN MODAL THÔNG BÁO VỪA VÀO TRANG (MỚI)  -->
<!-- ============================================== -->
<div id="welcome-modal" class="viewer" hidden style="z-index: 9999; cursor: default;">
  <div class="modal-box" style="max-width: 360px; padding: 32px 24px; text-align: center; align-items: center;">
    <!-- Icon Cảnh báo phát sáng -->
    <div style="width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, rgba(252,211,77,0.2), rgba(252,211,77,0.05)); border: 1px solid rgba(252,211,77,0.3); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: var(--gold); box-shadow: 0 0 24px rgba(252,211,77,0.2);">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <h2 style="font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 8px;">WEB chưa hoàn thiện!</h2>
    <p style="font-size: 15px; color: rgba(255,255,255,0.75); margin-bottom: 24px; line-height: 1.5;">Trang web hiện đang trong quá trình phát triển và hoàn thiện. Một số thông tin hoặc chức năng có thể chưa đầy đủ.</p>
    <button class="btn main" style="width: 100%; height: 48px; font-size: 16px;" onclick="closeWelcomeModal()">Đã hiểu & Tiếp tục</button>
  </div>
</div>

<!-- GIAO DIỆN MODAL HIỂN THỊ CHI TIẾT SẢN PHẨM -->
<div id="detail-modal" class="viewer" hidden>
  <div class="modal-box">
    <button class="vclose" type="button" aria-label="Đóng" onclick="closeDetailModal()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <img id="m-img" class="modal-img" alt="Bìa" src="">
    <div class="m-body">
      <h2 id="m-title" class="m-title"></h2>
      <p id="m-sub" class="m-sub"></p>
      <div class="sec">MÔ TẢ</div>
      <p id="m-desc" class="m-desc"></p>
      <div id="m-acts" class="m-acts"></div>
    </div>
  </div>
</div>

async function zalith(btn) {
  const label = btn.querySelector("span"), old = label.textContent;
  btn.disabled = true; label.textContent = "Đang tìm bản mới nhất…";
  try {
    const r = await fetch("https://api.github.com/repos/" + CONFIG.zalithRepo + "/releases/latest", { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const apks = (d.assets || []).filter(a => /\.apk$/i.test(a.name));
    const a = apks.find(x => /arm64|v8a/i.test(x.name)) || apks.find(x => /universal/i.test(x.name)) || apks[0];
    if (!a) throw new Error("no apk");
    label.textContent = "Đang tải " + (d.tag_name || ""); location.assign(a.browser_download_url);
    setTimeout(() => { label.textContent = old; btn.disabled = false; }, 3500);
  } catch (e) {
    label.textContent = old; btn.disabled = false;
    window.open("https://github.com/" + CONFIG.zalithRepo + "/releases/latest", "_blank", "noopener"); toast("Không lấy được tự động, đã mở trang GitHub.");
  }
}

  const w = el("nav", "chips"); w.setAttribute("aria-label", "Thư mục");
  tab.folders.forEach(f => {
    const b = el("button", "chip" + (f.id === S.folder ? " on" : "")); b.innerHTML = svg(FICON[f.id] || "folder", 20);
    b.append(el("span", "", f.name));
    b.onclick = () => location.replace("#" + S.tab + "/" + f.id);
    w.append(b);
  });
  return w;
}

function view() {
  const { tab } = cur(), root = $("view");
  document.querySelectorAll("#dock a").forEach(a => {
    if (a.dataset.k === S.tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  root.replaceChildren();

  // ĐIỀU KIỆN HIỂN THỊ THANH TÌM KIẾM HOẶC BỘ ĐẾM TRUY CẬP
  let topBar;
  if (S.tab === "info") {
    topBar = el("div", "visit-counter");
    topBar.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--pri)"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    <span>Lượt truy cập trang: <b id="live-view-count" style="color:var(--gold);font-size:18px;margin-left:4px;">...</b></span>`;

    // Gọi API miễn phí (CounterAPI) để lấy và tăng lượt truy cập
    fetch("https://api.counterapi.dev/v1/kaitouu_page_1307/visits/up")
      .then(r => r.json())
      .then(d => { const c = document.getElementById("live-view-count"); if(c) c.textContent = d.count.toLocaleString(); })
      .catch(e => { const c = document.getElementById("live-view-count"); if(c) c.textContent = "92"; });
  } else {
    topBar = el("label", "search"); topBar.innerHTML = svg("search", 22);
    const inp = el("input"); inp.type = "search"; inp.placeholder = "Tìm trong " + tab.label + "…"; inp.value = S.q;
    const clr = el("button", "clr"); clr.type = "button"; clr.hidden = !S.q; clr.setAttribute("aria-label", "Xoá"); clr.innerHTML = svg("x", 20);
    topBar.append(inp, clr);
    
    inp.oninput = () => { S.q = inp.value; upd(); };
    clr.onclick = () => { inp.value = ""; S.q = ""; upd(); inp.focus(); };
  }

  const top = el("div"); top.append(heroEl(tab)); if (tab.folders) top.append(chipsEl(tab));
  const list = el("div"); list.id = "list";
  
  const upd = () => {
    if (S.tab !== "info") {
      const clr = topBar.querySelector(".clr");
      if (clr) clr.hidden = !S.q;
      top.hidden = !!S.q.trim();
    }
    renderList();
  };
  
  root.append(topBar, top, list); upd();
  const on = root.querySelector(".chip.on");
  if (on) { const w = on.parentNode; w.scrollLeft = on.offsetLeft - (w.clientWidth - on.offsetWidth) / 2; }
}

const prev = { tab: null };
const scroller = $("scroller");
function dockTo(t) {
  document.querySelectorAll("#dock a").forEach(a => {
    if (a.dataset.k === t) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  glide(false);
}
function route() {
  const token = ++route.n;
  if (route.anim) { route.anim.cancel(); route.anim = null; }
  const old = prev.tab, p = location.hash.slice(1).split("/");
  const nt = TABS.includes(p[0]) ? p[0] : "java";
  const dir = old === null || nt === old ? 0 : (TABS.indexOf(nt) > TABS.indexOf(old) ? 1 : -1);
  const go = () => {
    S.tab = nt; const tab = CONFIG.tabs[S.tab];
    S.folder = tab.folders ? (tab.folders.some(f => f.id === p[1]) ? p[1] : tab.folders[0].id) : null;
    S.q = ""; view(); scroller.scrollTop = 0; glide(old === null);
    if (!reduce) {
      const root = $("view");
      if (old === null) pop(root.querySelectorAll(".search,.visit-counter,.hero,.chip,.sec,.card"));
      else if (dir !== 0) {
        pop(root.querySelectorAll(".search,.visit-counter,.hero,.chip,.sec,.card,.empty"), dir);
        const a = document.querySelector('#dock a[aria-current="page"]');
        a.animate([{ transform: "scale(.82)" }, { transform: "scale(1)" }], { duration: 420, easing: SPRING });
        a.querySelector("svg").animate([{ transform: "translateY(6px)" }, { transform: "translateY(0)" }], { duration: 460, easing: SPRING });
      } else {
        pop(root.querySelectorAll(".sec,.card,.empty"));
        const c = root.querySelector(".chip.on");
        if (c) c.animate([{ transform: "scale(.88)" }, { transform: "scale(1)" }], { duration: 400, easing: SPRING });
      }
    }
    prev.tab = S.tab;
  };
  if (reduce || old === null) { go(); return; }
  if (dir) dockTo(nt);
  const target = dir ? $("view") : $("list");
  if (!target) { go(); return; }
  const a = target.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translate(" + (-dir * 22) + "px," + (dir ? 0 : -8) + "px)" }], { duration: 130, easing: "ease-in", fill: "forwards" });
  route.anim = a;
  a.onfinish = () => { if (token !== route.n) return; go(); a.cancel(); route.anim = null; };
}
route.n = 0;

document.title = CONFIG.name;
const glider = el("span", "glider"); glider.id = "glider"; $("dock").append(glider);
TABS.forEach(k => {
  const a = el("a"); a.href = "#" + k; a.dataset.k = k;
  const pill = el("span", "pill"); pill.innerHTML = svg(k);
  a.append(pill, el("span", "", CONFIG.tabs[k].label)); $("dock").append(a);
});
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => glide(true));
route();
</script>
</body>
</html>
