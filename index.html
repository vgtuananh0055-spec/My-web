<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070d" id="meta-theme">
<title>Trang cá nhân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bgfx" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><div class="pix"></div><div class="scrim"></div></div>
<div class="prog" id="prog"></div>

<div class="shell">
  <aside class="side" id="side"></aside>
  <div>
    <header class="mtop" id="mtop"></header>
    <nav class="seg glass" id="seg" aria-label="Chuyển tab"></nav>
    <main id="view"></main>
  </div>
</div>

<!-- Chi tiết -->
<div class="dlg" id="dlg"><div class="sheet" id="sheet"></div></div>
<!-- Chào mừng -->
<div class="dlg w" id="welcome">
  <div class="sheet wsheet" style="border-radius:var(--radius)">
    <div class="glow"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg></div>
    <h2 id="w-title">Thông báo</h2>
    <p id="w-desc"></p>
    <button class="btn pri" style="width:100%;height:46px" id="w-btn">Tiếp tục</button>
  </div>
</div>
<!-- Lightbox -->
<div class="lb" id="lb">
  <button class="ib" type="button" aria-label="Đóng" id="lb-x"></button>
  <button class="lb-nav l" type="button" aria-label="Ảnh trước" id="lb-prev" hidden></button>
  <button class="lb-nav r" type="button" aria-label="Ảnh sau" id="lb-next" hidden></button>
  <figure><div id="lb-c"></div><figcaption id="lb-cap"></figcaption></figure>
</div>
<!-- Command palette -->
<div class="pal" id="pal"><div class="pbox">
  <div class="phead"><span id="pal-ic"></span><input id="pin" type="text" placeholder="Tìm mọi thứ: plugin, map, launcher, mạng xã hội…" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div>
  <div class="plist" id="plist"></div>
  <div class="pfoot"><span>↑↓ chọn</span><span>↵ mở</span><span>Esc đóng</span></div>
</div></div>
<div class="toast glass" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
